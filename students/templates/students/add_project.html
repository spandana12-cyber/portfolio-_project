{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div class="container">
    <h2>Add Project</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text" name="title" class="form-control" placeholder="Project Title" required>
        </div>
        <div class="mb-3">
            <input type="url" name="link" class="form-control" placeholder="Project Link (optional)">
        </div>
        <div class="mb-3">
            <textarea name="description" class="form-control" placeholder="Project Description (optional)"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Project</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% extends 'students/base.html' %}

{% block content %}

<h2>Add Project</h2>

<form method="POST">

{% csrf_token %}

<input type="text" name="title" placeholder="Project Title">

<textarea name="description" placeholder="Description"></textarea>

<input type="text" name="link" placeholder="Project Link">

<button type="submit">Add Project</button>

</form>

{% endblock %}
</body>
</html>
